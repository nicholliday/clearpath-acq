<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0B1220;--card:#141D2E;--card2:#1B2740;--line:#26334D;--text:#EDF1F7;--mut:#93A1B8;--blue:#3B82F6;--gold:#D4AF37;--green:#10B981;--red:#EF4444;--amber:#F59E0B}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{padding-top:max(0.6rem,env(safe-area-inset-top));padding-bottom:max(4.5rem,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0.6rem 0.8rem}
.brand{font-size:10px;letter-spacing:0.12em;color:var(--gold);font-weight:700}
h1{font-size:19px;font-weight:700;margin:2px 0 10px}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:9px;color:var(--mut);letter-spacing:.05em}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:6px}
.p-new{background:#1E3A8A;color:#BFDBFE}.p-con{background:#42350D;color:#FCE28A}.p-off{background:#3A2A0D;color:#FCD34D}.p-fup{background:#312E81;color:#C7D2FE}.p-uc{background:#064E3B;color:#6EE7B7}.p-dead{background:#450A0A;color:#FCA5A5}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 10px;font-size:14px;margin-bottom:8px}

.row{display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;overflow-y:auto;padding:20px 12px 60px}
.modal.on{display:block}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;margin:0 auto;padding:18px 16px}
.sbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:4px 0 8px}

table{width:100%;border-collapse:collapse;font-size:12px}

#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

<script>
var db=supabase.createClient('https://voitbqpvynbvlibuzxbz.supabase.co','sb_publishable_QreaC86dKq8FRmJPDkeenA_wZO8G5YG');
var D={leads:[],offers:[],act:[],targets:{},spend:[]};
var STAGES=['New','Contacted','Offer Made','Follow-Up','Under Contract','Dead'];
var PCLS={'New':'p-new','Contacted':'p-con','Offer Made':'p-off','Follow-Up':'p-fup','Under Contract':'p-uc','Dead':'p-dead'};

async function tryPass(){
  var v=(document.getElementById('pw').value||'').toLowerCase().trim();
  if(!v)return;
  if(v==='clearpathowner'){
    ROLE='owner';ME=null;
    localStorage.setItem('cp_acq_role',ROLE);localStorage.removeItem('cp_acq_me');
    document.getElementById('lock').style.display='none';
    buildTabs(); loadAll();
    return;
  }
  var r=await db.from('acq_reps').select('name,passcode');
  var hit=(r.data||[]).find(function(x){return (x.passcode||'').toLowerCase().trim()===v});
  if(!hit){alert('Wrong passcode');return;}
  ROLE='rep';ME=hit.name;
  localStorage.setItem('cp_acq_role',ROLE);localStorage.setItem('cp_acq_me',ME);
  document.getElementById('lock').style.display='none';
  buildTabs(); loadAll();
}
function buildTabs(){
  var t='<button id="tb_script" onclick="nav(\'script\')"><span class="ic">\ud83d\udcdc</span>Script</button>'
   +'<button id="tb_today" onclick="nav(\'today\')"><span class="ic">\u2600\ufe0f</span>Today</button>'
   +'<button id="tb_goal" onclick="nav(\'goal\')"><span class="ic">\ud83c\udfaf</span>Goal Hitter</button>'
   +'<button id="tb_cmd" onclick="nav(\'cmd\')"><span class="ic">\ud83d\udcca</span>KPIs</button>'
   +'<button id="tb_bot" onclick="nav(\'bot\')"><span class="ic">\ud83e\udd16</span>Bot</button>'
   +'<button id="tb_earn" onclick="nav(\'earn\')"><span class="ic">\ud83d\udcb0</span>Comp Plan</button>'
   
   +(ROLE==='owner'?'<button id="tb_owner" onclick="nav(\'owner\')"><span class="ic">\ud83d\udc51</span>Owner</button>':'')
   +'<button id="tb_inputs" onclick="nav(\'inputs\')"><span class="ic">\u2699\ufe0f</span>Inputs</button>';
  document.getElementById('tabbar').innerHTML=t;
  document.getElementById('roleBadge').style.display=ROLE==='owner'?'inline-block':'none';
  var tbE=document.getElementById('tb_earn'); if(tbE) tbE.style.display=(ROLE==='owner'||EMBED_NIC)?'none':'';
  if(EMBED_NIC){var tbB=document.getElementById('tb_bot');if(tbB)tbB.style.display='none';var tbI=document.getElementById('tb_inputs');if(tbI)tbI.style.display='none';}
  var wb=document.getElementById('whoBadge');
  if(wb) wb.textContent = ROLE==='owner' ? '\uD83D\uDC64 Owner' : (ME ? '\uD83D\uDC64 '+ME : '');
  nav('today');
}
function nav(v){
  var tt=document.getElementById('appTitle');
  if(tt){
    if(v==='today'){
      var now=new Date();
      tt.textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    } else if(v==='goal'){
      tt.textContent='Comission Calculator';
    } else if(v==='earn'){
      tt.textContent='Compensation Plan';
    } else {
      tt.textContent='Acq Tracker';
    }
  }

  ['script','today','goal','cmd','bot','earn','metrics','inputs','owner'].forEach(function(k){
    var el=document.getElementById('v_'+k), tb=document.getElementById('tb_'+k);
    if(el)el.classList.toggle('on',k===v);
    if(tb)tb.classList.toggle('on',k===v);
  });
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function fmt$(n){return n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString()}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthStart(){return today().slice(0,8)+'01'}
function quarterStart(){var d=new Date();var q=Math.floor(d.getMonth()/3)*3;return d.getFullYear()+'-'+String(q+1).padStart(2,'0')+'-01'}
function yearStart(){return today().slice(0,4)+'-01-01'}
function stlFmt(m){return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'}
function pbHTML(){
  if(!ME) return '';
  var t=today();
  function weekKey(d){var x=new Date(d+'T12:00:00');var dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
  var curW=weekKey(t), curM=t.slice(0,7);
  // per-day totals for ME: dials, convos, talk(sec), offers, contracts
  var days={};
  function bump(d,k,v){if(!days[d])days[d]={dials:0,convos:0,talk:0,offers:0,contracts:0};days[d][k]+=v}
  (D.act||[]).forEach(function(a){if((a.rep||D.reps[0])!==ME||!a.on_date)return;bump(a.on_date,'dials',a.dials||0);bump(a.on_date,'convos',a.convos||0);bump(a.on_date,'talk',a.talk_min||0)});
  (D.offers||[]).forEach(function(o){if(offerRep(o)!==ME||!o.offered_on)return;bump(String(o.offered_on).slice(0,10),'offers',1)});
  (D.leads||[]).forEach(function(l){if(repOf(l)!==ME||!l.contracted_on)return;bump(String(l.contracted_on).slice(0,10),'contracts',1)});
  var METS=[['dials','dials',null],['convos','convos',null],['talk','talk time',function(v){return stlFmt(Math.round(v/60))}],['offers','offers',null],['contracts','contracts',null]];
  var wins=[];
  // aggregate helper: {key->totals} for a keyFn
  function agg(keyFn){var o={};Object.keys(days).forEach(function(d){var k=keyFn(d);if(!o[k])o[k]={dials:0,convos:0,talk:0,offers:0,contracts:0};METS.forEach(function(m){o[k][m[0]]+=days[d][m[0]]})});return o}
  var byDay=days, byWeek=agg(weekKey), byMonth=agg(function(d){return d.slice(0,7)});
  function check(map,curKey,label){
    var prior=Object.keys(map).filter(function(k){return k<curKey});
    if(!prior.length)return; // new rep guard: need a completed prior period
    METS.forEach(function(m){
      var best=0; prior.forEach(function(k){best=Math.max(best,map[k][m[0]])});
      var cur=(map[curKey]||{})[m[0]]||0;
      if(best>0&&cur>best){
        var f=m[2]||function(v){return String(v)};
        wins.push(f(cur)+' '+m[1]+' \u2014 best '+label+' <span class="sm mut">(old '+f(best)+')</span>');
      }
    });
  }
  check(byDay,t,'DAY'); check(byWeek,curW,'WEEK'); check(byMonth,curM,'MONTH');
  // company records: single-day bests across ALL reps, prior to today
  var crWins=[];
  (function(){
    var all={};
    function bumpAll(rep,d,k,v){var key=d;if(!all[key])all[key]={};if(!all[key][rep])all[key][rep]={dials:0,convos:0,talk:0,offers:0,contracts:0};all[key][rep][k]+=v}
    (D.act||[]).forEach(function(a){if(!a.on_date)return;var rp=a.rep||D.reps[0];bumpAll(rp,a.on_date,'dials',a.dials||0);bumpAll(rp,a.on_date,'convos',a.convos||0);bumpAll(rp,a.on_date,'talk',a.talk_min||0)});
    (D.offers||[]).forEach(function(o){if(!o.offered_on)return;bumpAll(offerRep(o)||D.reps[0],String(o.offered_on).slice(0,10),'offers',1)});
    (D.leads||[]).forEach(function(l){if(!l.contracted_on)return;bumpAll(repOf(l),String(l.contracted_on).slice(0,10),'contracts',1)});
    METS.forEach(function(m){
      var rec=0;
      Object.keys(all).forEach(function(d){if(d>=t)return;Object.keys(all[d]).forEach(function(rp){rec=Math.max(rec,all[d][rp][m[0]]||0)})});
      var mine=((all[t]||{})[ME]||{})[m[0]]||0;
      if(rec>0&&mine>rec){
        var f=m[2]||function(v){return String(v)};
        crWins.push(f(mine)+' '+m[1]+' <span class="sm mut">(old record '+f(rec)+')</span>');
      }
    });
  })();
  var crBanner='';
  if(crWins.length){
    crBanner='<div style="background:linear-gradient(90deg,rgba(61,214,140,.18),rgba(61,214,140,.06));border:1px solid var(--green);border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:center">'
      +'<div style="font-weight:800;letter-spacing:.12em;color:var(--green)">\ud83d\udc51 '+esc((ME||'').split(' ')[0]).toUpperCase()+' \u2014 NEW COMPANY RECORD</div>'
      +'<div class="sm" style="margin-top:4px">'+crWins.join(' \u00b7 ')+'</div></div>';
  }
  if(!wins.length&&!crBanner)return '';
  if(!wins.length)return crBanner;
  return crBanner+'<div style="background:linear-gradient(90deg,rgba(212,175,55,.18),rgba(212,175,55,.06));border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:center">'
    +'<div style="font-weight:800;letter-spacing:.12em;color:var(--gold)">\uD83C\uDFC6 '+esc((ME||'').split(' ')[0]).toUpperCase()+' \u2014 NEW PERSONAL BEST</div>'
    +'<div class="sm" style="margin-top:4px">'+wins.join(' \u00b7 ')+'</div></div>';
}

function stlAvgFor(rep,from){
  var tot=0,n=0;
  (D.leads||[]).forEach(function(l){
    if(!l.phone||!l.created_at)return;
    if(l.created_at.slice(0,10)<from)return;
    var t0=new Date(l.created_at).getTime(),best=null,bRep=null;
    (D.calls||[]).forEach(function(c){if(c.phone===l.phone){var ct=new Date(c.called_at).getTime();if(ct>=t0-60000&&(best==null||ct<best)){best=ct;bRep=c.rep}}});
    if(best!=null&&(!rep||bRep===rep)){tot+=Math.max(0,Math.round((best-stlStart(l.created_at))/60000));n++}
  });
  return n?Math.round(tot/n):null;
}
// speed-to-lead clock starts inside business hours (9am-8pm, 7 days):
// day lead -> clock starts at arrival; night/early lead -> clock starts 9:00am next window
function stlStart(iso){
  var d=new Date(iso), s=new Date(d);
  if(d.getHours()>=20){s.setDate(s.getDate()+1);s.setHours(9,0,0,0);}
  else if(d.getHours()<9){s.setHours(9,0,0,0);}
  return s.getTime();
}


async function loadAll(){
  var r=await Promise.all([
    db.from('acq_leads').select('*').order('created_at',{ascending:false}),
    db.from('acq_offers').select('*'),
    db.from('acq_activity').select('*'),
    db.from('acq_targets').select('*'),
    db.from('acq_spend').select('*'),
    db.from('deals').select('id,address,stage,revenue_closed,contract_price'),
    db.from('stage_history').select('deal_id,stage,entered_on'),
    db.from('acq_reps').select('*').order('created_at'),
    db.from('acq_calls').select('phone,called_at,rep,counted'),
    db.from('master_monthly').select('*').order('month'),
    db.from('master_expenses').select('*'),
    db.from('meta_phone_book').select('phone'),
    db.from('meta_contact_book').select('contact_id')
  ]);
  for(var i=0;i<r.length;i++){if(r[i].error){alert(r[i].error.message);return}}
  D.leads=r[0].data;D.offers=r[1].data;D.act=r[2].data;D.spend=r[4].data;D.ddeals=r[5].data||[];D.dhist=r[6].data||[];D.reps=(r[7].data||[]).map(function(x){return x.name});if(!D.reps.length)D.reps=['Rep 1'];D.repGoals={};(r[7].data||[]).forEach(function(x){D.repGoals[x.name]=Number(x.monthly_goal)||8000});D.repRamp={};(r[7].data||[]).forEach(function(x){if(x.ramp_start)D.repRamp[x.name]=x.ramp_start});D.repPass={};(r[7].data||[]).forEach(function(x){if(x.passcode)D.repPass[x.name]=x.passcode});D.calls=(r[8].data||[]);D.master=(r[9].data||[]);D.mexp=(r[10].data||[]);
  D.mphones={};(r[11].data||[]).forEach(function(x){D.mphones[x.phone]=1});
  D.mcontacts={};(r[12].data||[]).forEach(function(x){D.mcontacts[x.contact_id]=1});
  D.targets={};r[3].data.forEach(function(t){D.targets[t.key]=Number(t.value)});
  if(D.targets.owner_goal!=null)D.ownerGoal=D.targets.owner_goal;
  if(D.targets.owner_fallout!=null)D.ownerFallout=D.targets.owner_fallout;
  render();
}
function T(k,d){return D.targets[k]!=null?D.targets[k]:d}
function leadIsMetaG(l){
  if(!l)return false;
  if((l.source||'')==='Meta')return true;
  if(l.ghl_opp_id&&D.mcontacts&&D.mcontacts[l.ghl_opp_id])return true;
  if(l.ghl_contact_id&&D.mcontacts&&D.mcontacts[l.ghl_contact_id])return true;
  var p=String(l.phone||'').replace(/[^0-9]/g,'').slice(-10);
  if(p&&D.mphones&&D.mphones[p])return true;
  return false;
}

var BOARD=null; // null = total acq, else rep name
function offerRep(of){if(of.rep)return of.rep;var l=leadById(of.lead_id);return l?repOf(l):null}
function repOf(l){return l.rep||D.reps[0]}
function leadRepOk(l){return !BOARD||repOf(l)===BOARD}
function sumAct(from){
  var o={dials:0,convos:0,talk:0};
  D.act.forEach(function(a){if(a.on_date>=from&&(!BOARD||(a.rep||D.reps[0])===BOARD)){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  o.talk=Math.round(o.talk/60);
  return o;
}
function leadById(id){return D.leads.find(function(l){return l.id===id})}
function countOffers(from){return D.offers.filter(function(o){var l=leadById(o.lead_id);return o.offered_on>=from&&(!l||leadRepOk(l))}).length}
function countContracts(from){return D.leads.filter(function(l){return l.contracted_on&&l.contracted_on>=from&&leadRepOk(l)}).length}
function countLeadsIn(from){return D.leads.filter(function(l){return (l.created_at||'').slice(0,10)>=from&&leadRepOk(l)}).length}
function closedStats(from){
  var o={assigned:0,closed:0,revenue:0};
  D.leads.forEach(function(l){
    if(!l.deal_id||!leadRepOk(l))return;
    var em=stageMoveOn(l.deal_id,'EMD In'),cl=stageMoveOn(l.deal_id,'Closed');
    if(em&&em>=from)o.assigned++;
    if(cl&&cl>=from){o.closed++;var d=linkedDeal(l);o.revenue+=(d&&d.revenue_closed)||0}
  });
  return o;
}

/* ============ RENDER ============ */
function render(){renderScript();renderToday();renderGoal();renderCommand();renderBot();renderEarnings();renderMetrics();renderInputs();renderOwner()}

function renderToday(){
  var t=today();
  var reps=D.reps;
  var n=Math.max(1,reps.length);
  var stats={};reps.forEach(function(rp){stats[rp]=repRange(rp,t)});
  function hm(min){return Math.floor(min/60)+'h '+(min%60)+'m'}
  var bigSize='min('+Math.max(11,Math.floor(64/n))+'vw,96px)';
  var smallSize='min('+Math.max(7,Math.floor(40/n))+'vw,54px)';

  var h='<div class="kpi" style="padding:24px 8px 18px;border-radius:20px;min-height:calc(100vh - 170px);display:flex;flex-direction:column">';
  h+=pbHTML();

  // All-time single-day PRs per metric (record + holder), live from history

    Object.keys(cm).forEach(function(k){var rp=k.split('|')[0];if(!PRS.contracts||cm[k]>PRS.contracts.v)PRS.contracts={v:cm[k],rep:rp}});
    // Historic record floors (pre-tracker era) - live data overtakes only when beaten
    if(!PRS.dials||PRS.dials.v<211)PRS.dials={v:211,rep:'Nic'};

    if(!PRS.contracts||PRS.contracts.v<3)PRS.contracts={v:3,rep:'Nic'};
  })();
  function prTag(key,fmtFn){
    var p=PRS[key];if(!p||!p.v)return '';
    var dv=fmtFn?fmtFn(p.v):p.v;
    var who2=(p.rep||'').split(' ')[0];

  ];
  rows.forEach(function(row,ri){
    var label=row[0], key=row[1], target=row[2], fmtFn=row[3];
    var vals=reps.map(function(rp){return stats[rp][key]});
    var best=Math.max.apply(null,vals);

    var pct=target?Math.min(100,Math.round(teamV/target*100)):0;
    h+='<div style="'+(ri>0?'border-top:1px solid var(--line);':'')+'padding:10px 0;flex:1;display:flex;flex-direction:column;justify-content:center">'

     +'<div style="display:flex;align-items:baseline">'+reps.map(function(rp,i){
        var v=vals[i], lead=v===best&&v>0;

        var pctR=prT?Math.min(100,Math.round(v/prT*100)):null;
        var metaBits=[];
        if(pctR!=null)metaBits.push(pctR>=100?'<span style="color:var(--green);font-weight:800">DONE</span>':pctR+'%');
        if(key==='dials')metaBits.push((stats[rp].mdials||0)+' meta');
        if(key==='convos')metaBits.push((stats[rp].mconvos||0)+' meta');
        if(key==='talk'){var mtv=stats[rp].mtalk||0;metaBits.push((mtv<60?mtv+'m':Math.floor(mtv/60)+'h '+(mtv%60)+'m')+' meta');}
        if(key==='offers')metaBits.push((stats[rp].moffers||0)+' meta');
        if(key==='contracts')metaBits.push((stats[rp].mcontracts||0)+' meta');
        var metaTag=metaBits.length?'<div style="font-size:11px;color:var(--mut);margin-top:4px">'+metaBits.join(' \u00b7 ')+'</div>':'';
        var numStyle;
        if(pctR==null){numStyle='color:'+(lead?'var(--gold)':'var(--text)');}
        else if(pctR>=100){numStyle='color:var(--green)';}
        else{var fillH=Math.round(pctR*0.72);numStyle='background:linear-gradient(to top,var(--gold) 0%,var(--gold) '+fillH+'%,#55627a '+fillH+'%,#55627a 100%);-webkit-background-clip:text;background-clip:text;color:transparent';}
        return '<div style="flex:1;text-align:center"><span style="font-size:'+(fmtFn?smallSize:bigSize)+';font-weight:800;line-height:1;'+numStyle+'">'+disp+'</span>'+(lead?' <span style="font-size:18px">\uD83D\uDC51</span>':'')+metaTag+'</div>';
      }).join('')+'</div>'
     +'</div>';
  });
  // 6th row: profit locked TODAY (real deal values, avg-fee fallback)
  (function(){
    var avgFee=T('avgfee',15000);
    var projs=reps.map(function(rp){
      var s=0;
      (D.leads||[]).forEach(function(l){
        if(repOf(l)!==rp) return;
        if(l.contracted_on!==t) return;
        s+=Number(l.projected_profit)||avgFee;
      });

    });
    var best=Math.max.apply(null,projs);
    h+='<div style="border-top:1px solid var(--line);padding:10px 0;flex:1;display:flex;flex-direction:column;justify-content:center">'

     +'<div style="display:flex;align-items:baseline">'+reps.map(function(rp,i){

      }).join('')+'</div>'
     +'</div>';
  })();
  h+='</div>';

function speedToLead(){
  var ds=[];
  D.leads.forEach(function(l){
    if(!l.phone||!l.created_at)return;
    var p=(l.phone||'').replace(/[^0-9]/g,'').slice(-10);if(p.length<7)return;
    var t0=new Date(l.created_at).getTime(),best=null;
    (D.calls||[]).forEach(function(c){
      if(String(c.phone||'').slice(-10)!==p)return;
      var ct=new Date(c.called_at).getTime();
      if(ct>=t0&&(best===null||ct<best))best=ct;
    });
    if(best!==null)ds.push((best-t0)/60000);
  });
  if(!ds.length)return null;
  return Math.round(ds.reduce(function(s,x){return s+x},0)/ds.length);
}

function ownAgg(from){
  var o={leads:0,dials:0,convos:0,talk:0,offers:0,contracts:0,assigned:0,closed:0,rev:0,pipeDeals:0,pipeRev:0,cycleDays:[],falls:0};
  (D.leads||[]).forEach(function(l){

    if(l.assigned_on&&l.assigned_on>=from)o.assigned++;
    if(l.stage==='Fallout')o.falls++;
    if(l.closed_on&&l.closed_on>=from){o.closed++;o.rev+=Number(l.revenue_closed)||0;
      if(c)o.cycleDays.push(Math.round((new Date(l.closed_on)-new Date(c))/86400000));}
    if(l.contracted_on&&!l.closed_on&&l.stage!=='Fallout'){o.pipeDeals++;o.pipeRev+=Number(l.projected_profit)||0}

  (D.offers||[]).forEach(function(x){if(x.offered_on&&String(x.offered_on).slice(0,10)>=from)o.offers++});
  o.talk=Math.round(o.talk/60);

  h+='<div class="card"><h2>\ud83d\udc4b Your account</h2><div class="sm">Signed in as <b>'+(ROLE==='owner'?'Owner':esc(ME||'?'))+'</b>'+(ROLE==='rep'?' \u2014 your Goal Hitter and Comp Plan are personal to you.':'')+'</div><button class="btn mut" onclick="logOut()">Log out</button></div>'
   +(ROLE==='owner'?'<div class="card"><h2>👥 Reps</h2><div class="sm mut" style="margin-bottom:8px">Boards, lead assignment, and the calculator use this list.</div>'
   +D.reps.map(function(rp){return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>'+esc(rp)+'</span>'+(ROLE==='owner'?'<button class="btn d" onclick="delRep(\''+esc(rp)+'\')">✕</button>':'')+'</div>'}).join('')
   +(ROLE==='owner'?'<input id="nr_name" placeholder="New rep name"><button class="btn g" onclick="addRep()">+ Add rep</button>':'')
   +(ROLE==='owner'?'<div style="margin-top:12px"><b class="sm">💰 Monthly commission goals</b></div>'
   +payReps().map(function(rp){var gid=rp.replace(/[^a-zA-Z0-9]/g,'_');return '<label>'+esc(rp)+' \u2014 goal \u00b7 ramp start \u00b7 passcode</label><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="goal_'+gid+'" type="number" value="'+((D.repGoals&&D.repGoals[rp])||8000)+'" style="flex:1;min-width:90px"><input id="ramp_'+gid+'" type="month" value="'+(((D.repRamp&&D.repRamp[rp])||monthStart()).slice(0,7))+'" style="flex:1;min-width:120px"><input id="pass_'+gid+'" placeholder="passcode" value="'+esc((D.repPass&&D.repPass[rp])||'')+'" style="flex:1;min-width:90px"><button class="btn g" onclick="saveGoal(\''+esc(rp)+'\')">Save</button></div>'}).join(''):'')
   +'</div>':'');
  h+='<div class="card"><h2>ℹ️ How counting works (v1)</h2><div class="sm mut" style="line-height:1.7">Dials, convos, and talk time track <b>automatically</b> — every GHL and OpenPhone call flows in on its own (2+ min = convo, same number within 60 min counts once). Offers: add the <b>offer tag</b> on the contact in the CRM. Contracts / send to Dispo: switch the pipeline to <b>CONTRACTS</b> → stage <b>Waiting for Photos</b>, tag it <b>contract - your name</b>, and notify Dispo. Claiming a lead: <b>assign yourself</b> as owner in the CRM once you\'ve connected. If a number ever looks off, tell Nic — corrections happen in the database, not the app.</div></div>';
  document.getElementById('v_inputs').innerHTML=h;
}
function logOut(){
  localStorage.removeItem('cp_acq_role');
  localStorage.removeItem('cp_acq_me');
  location.reload();
}
async function saveGoal(rp){
  var el=document.getElementById('goal_'+rp.replace(/[^a-zA-Z0-9]/g,'_'));if(!el)return;
  var rel=document.getElementById('ramp_'+rp.replace(/[^a-zA-Z0-9]/g,'_'));
  var upd={monthly_goal:Number(el.value)||8000};
  if(rel&&rel.value)upd.ramp_start=rel.value+'-01';
  var pel=document.getElementById('pass_'+rp.replace(/[^a-zA-Z0-9]/g,'_'));
  if(pel&&pel.value.trim())upd.passcode=pel.value.trim();
  var r=await db.from('acq_reps').update(upd).eq('name',rp);
  if(r.error)return alert(r.error.message);
  loadAll();
}
async function addRep(){
  var n=(document.getElementById('nr_name').value||'').trim();if(!n)return;
  var r=await db.from('acq_reps').insert({name:n});
  if(r.error)return alert(r.error.message);
  loadAll();
}
async function delRep(n){
  if(!confirm('Remove '+n+' from the rep list? (Their logged history stays.)'))return;
  var r=await db.from('acq_reps').delete().eq('name',n);
  if(r.error)return alert(r.error.message);
  loadAll();
}
async function saveTargets(){
  var keys=['dials_day','convos_day','talkmin_day','offers_day','contracts_day','contracts_month'];if(ROLE==='owner')keys.push('avgfee','strike_value','fx');
  for(var i=0;i<keys.length;i++){
    var el=document.getElementById('t_'+keys[i]);if(!el)continue;
    var r=await db.from('acq_targets').upsert({key:keys[i],value:Number(el.value)||0});
    if(r.error)return alert(r.error.message);
  }
  alert('Targets saved');loadAll();
}

var XX_DUMMY_REMOVED=0;
var HELP_STOP={'where':1,'do':1,'does':1,'i':1,'my':1,'me':1,'we':1,'our':1,'how':1,'what':1,'is':1,'are':1,'the':1,'a':1,'an':1,'to':1,'of':1,'in':1,'on':1,'for':1,'and':1,'or':1,'it':1,'can':1,'find':1,'see':1,'get':1,'go':1,'up':1,'set':1,'with':1,'this':1,'when':1,'why':1};
function helpMatches(q){
  q=(q||'').toLowerCase().trim();var idx=[];
  if(!q){HELP_TOPICS.forEach(function(_,i){idx.push(i)});return idx}
  var raw=q.split(/[^a-z0-9$%]+/).filter(Boolean);
  var words=raw.filter(function(w){return !HELP_STOP[w]});if(!words.length)words=raw;
  var all=[],any=[];
  HELP_TOPICS.forEach(function(t,i){
    var hay=(t.q+' '+(t.k||'')+' '+t.a).toLowerCase().replace(/<[^>]*>/g,' ');
    var m=0;words.forEach(function(w){if(hay.indexOf(w)>=0)m++});
    if(m===words.length)all.push(i);else if(m>0)any.push(i);
  });
  return all.length?all:any;
}
function helpFilter(q){
  var hits=helpMatches(q),qq=(q||'').trim();
  HELP_TOPICS.forEach(function(t,i){
    var row=document.getElementById('hlprow'+i),body=document.getElementById('hlp'+i);
    if(!row)return;var hit=hits.indexOf(i)>=0;
    row.style.display=hit?'block':'none';
    if(body)body.style.display=(qq&&hit&&hits.length<=4)?'block':'none';
  });
  var none=document.getElementById('hlpnone');
  if(none)none.style.display=hits.length?'none':'block';
}
function openHelp(){
  var h='<h2>❓ Help — how do I…</h2><input placeholder="🔍 Ask anything… e.g. how do i log an offer" autocomplete="off" oninput="helpFilter(this.value)">';
  HELP_TOPICS.forEach(function(t,i){
    h+='<div id="hlprow'+i+'" style="border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden">'
     +'<div onclick="var b=document.getElementById(\'hlp'+i+'\');b.style.display=b.style.display===\'none\'?\'block\':\'none\'" style="padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600">'+t.q+'</div>'
     +'<div id="hlp'+i+'" style="display:none;padding:0 12px 12px;font-size:12px;line-height:1.6">'+t.a+'</div></div>';
  });
  h+='<div id="hlpnone" style="display:none;font-size:12px;color:var(--mut);padding:8px 2px">No match — try one word (lead, offer, contract, dispo, install…).</div>'
   +'<button class="btn mut" onclick="closeModal()">Close</button>';
  openModal(h);
}

function setIdentity(rp){
  ME=rp;localStorage.setItem('cp_acq_me',rp);

function openModal(h){document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.add('on')}
