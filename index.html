<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CP Acq">
<meta name="theme-color" content="#0B1220">
<title>Clear Path Acq</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0B1220;--card:#141D2E;--card2:#1B2740;--line:#26334D;--text:#EDF1F7;--mut:#93A1B8;--blue:#3B82F6;--gold:#D4AF37;--green:#10B981;--red:#EF4444;--amber:#F59E0B}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{padding-top:max(0.6rem,env(safe-area-inset-top));padding-bottom:max(4.5rem,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0.6rem 0.8rem}
.brand{font-size:10px;letter-spacing:0.12em;color:var(--gold);font-weight:700}
h1{font-size:19px;font-weight:700;margin:2px 0 10px}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-size:10px;padding:9px 2px 7px;cursor:pointer}
.tabs button.on{color:var(--gold)}
.tabs .ic{font-size:19px;display:block;margin-bottom:2px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .v{font-size:20px;font-weight:800}.kpi .l{font-size:9px;color:var(--mut);letter-spacing:.05em}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:6px}
.p-new{background:#1E3A8A;color:#BFDBFE}.p-con{background:#42350D;color:#FCE28A}.p-off{background:#3A2A0D;color:#FCD34D}.p-fup{background:#312E81;color:#C7D2FE}.p-uc{background:#064E3B;color:#6EE7B7}.p-dead{background:#450A0A;color:#FCA5A5}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 10px;font-size:14px;margin-bottom:8px}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
.btn{background:var(--blue);border:none;color:#fff;font-weight:700;border-radius:9px;padding:9px 13px;font-size:13px;cursor:pointer;margin:2px 4px 2px 0}
.btn.g{background:var(--gold);color:#101828}.btn.gr{background:var(--green)}.btn.d{background:var(--red)}.btn.mut{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.btn.big{width:100%;padding:12px;font-size:15px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;overflow-y:auto;padding:20px 12px 60px}
.modal.on{display:block}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;margin:0 auto;padding:18px 16px}
.sbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:4px 0 8px}
.sbar i{display:block;height:100%;border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:10px;letter-spacing:.05em}
.help{position:fixed;right:16px;bottom:74px;z-index:90;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#E8C55A);color:#101828;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(212,175,55,.45)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.mut{color:var(--mut)}.sm{font-size:11px}.warn{color:var(--red);font-size:11px;font-weight:700}
</style>
</head>
<body>
<div id="lock">
  <div class="brand">CLEAR PATH PROPERTY SOLUTIONS</div>
  <h1 style="margin:6px 0 14px">Acq Tracker</h1>
  <input id="pw" type="password" placeholder="Your personal passcode" style="max-width:260px" onkeydown="if(event.key==='Enter')tryPass()">
  <button class="btn g" onclick="tryPass()" style="max-width:260px;width:100%">Enter</button>
</div>

<div class="wrap">
  <div class="brand">CLEAR PATH PROPERTY SOLUTIONS</div>
  <h1><span id="appTitle">Acq Tracker</span> <span id="roleBadge" class="pill p-uc" style="display:none">OWNER</span></h1>

  <div id="v_script" class="view"></div>
  <div id="v_today" class="view on"></div>
  <div id="v_goal" class="view"></div>
  <div id="v_bot" class="view"></div>
  <div id="v_cmd" class="view"></div>
  <div id="v_earn" class="view"></div>
  <div id="v_metrics" class="view"></div>
  <div id="v_inputs" class="view"></div>
</div>

<div class="help" onclick="openHelp()">?</div>
<div class="tabs" id="tabbar"></div>
<div class="modal" id="modal"><div class="mbox" id="mbody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var db=supabase.createClient('https://voitbqpvynbvlibuzxbz.supabase.co','sb_publishable_QreaC86dKq8FRmJPDkeenA_wZO8G5YG');
var D={leads:[],offers:[],act:[],targets:{},spend:[]};
var STAGES=['New','Contacted','Offer Made','Follow-Up','Under Contract','Dead'];
var PCLS={'New':'p-new','Contacted':'p-con','Offer Made':'p-off','Follow-Up':'p-fup','Under Contract':'p-uc','Dead':'p-dead'};
var ROLE=localStorage.getItem('cp_acq_role')||'';
var ME=localStorage.getItem('cp_acq_me')||null;

async function tryPass(){
  var v=(document.getElementById('pw').value||'').toLowerCase().trim();
  if(!v)return;
  if(v==='clearpathowner'){
    ROLE='owner';ME=null;
    localStorage.setItem('cp_acq_role',ROLE);localStorage.removeItem('cp_acq_me');
    document.getElementById('lock').style.display='none';
    buildTabs(); loadAll();
    return;
  }
  var r=await db.from('acq_reps').select('name,passcode');
  var hit=(r.data||[]).find(function(x){return (x.passcode||'').toLowerCase().trim()===v});
  if(!hit){alert('Wrong passcode');return;}
  ROLE='rep';ME=hit.name;
  localStorage.setItem('cp_acq_role',ROLE);localStorage.setItem('cp_acq_me',ME);
  document.getElementById('lock').style.display='none';
  buildTabs(); loadAll();
}
function buildTabs(){
  var t='<button id="tb_script" onclick="nav(\'script\')"><span class="ic">\ud83d\udcdc</span>Script</button>'
   +'<button id="tb_today" onclick="nav(\'today\')"><span class="ic">\u2600\ufe0f</span>Today</button>'
   +'<button id="tb_goal" onclick="nav(\'goal\')"><span class="ic">\ud83c\udfaf</span>Goal Hitter</button>'
   +'<button id="tb_cmd" onclick="nav(\'cmd\')"><span class="ic">\ud83d\udcca</span>KPIs</button>'
   +'<button id="tb_bot" onclick="nav(\'bot\')"><span class="ic">\ud83e\udd16</span>Bot</button>'
   +'<button id="tb_earn" onclick="nav(\'earn\')"><span class="ic">\ud83d\udcb0</span>Comp Plan</button>'
   
   +'<button id="tb_inputs" onclick="nav(\'inputs\')"><span class="ic">\u2699\ufe0f</span>Inputs</button>';
  document.getElementById('tabbar').innerHTML=t;
  document.getElementById('roleBadge').style.display=ROLE==='owner'?'inline-block':'none';
  nav('today');
}
function nav(v){
  var tt=document.getElementById('appTitle');
  if(tt){
    if(v==='today'){
      var now=new Date();
      tt.textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    } else {
      tt.textContent='Acq Tracker';
    }
  }

  ['script','today','goal','cmd','bot','earn','metrics','inputs'].forEach(function(k){
    var el=document.getElementById('v_'+k), tb=document.getElementById('tb_'+k);
    if(el)el.classList.toggle('on',k===v);
    if(tb)tb.classList.toggle('on',k===v);
  });
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function fmt$(n){return n==null||isNaN(n)?'—':'$'+Number(n).toLocaleString()}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthStart(){return today().slice(0,8)+'01'}
function quarterStart(){var d=new Date();var q=Math.floor(d.getMonth()/3)*3;return d.getFullYear()+'-'+String(q+1).padStart(2,'0')+'-01'}
function yearStart(){return today().slice(0,4)+'-01-01'}

async function loadAll(){
  var r=await Promise.all([
    db.from('acq_leads').select('*').order('created_at',{ascending:false}),
    db.from('acq_offers').select('*'),
    db.from('acq_activity').select('*'),
    db.from('acq_targets').select('*'),
    db.from('acq_spend').select('*'),
    db.from('deals').select('id,address,stage,revenue_closed,contract_price'),
    db.from('stage_history').select('deal_id,stage,entered_on'),
    db.from('acq_reps').select('*').order('created_at'),
    db.from('acq_calls').select('phone,called_at,rep,counted')
  ]);
  for(var i=0;i<r.length;i++){if(r[i].error){alert(r[i].error.message);return}}
  D.leads=r[0].data;D.offers=r[1].data;D.act=r[2].data;D.spend=r[4].data;D.ddeals=r[5].data||[];D.dhist=r[6].data||[];D.reps=(r[7].data||[]).map(function(x){return x.name});if(!D.reps.length)D.reps=['Rep 1'];D.repGoals={};(r[7].data||[]).forEach(function(x){D.repGoals[x.name]=Number(x.monthly_goal)||8000});D.repRamp={};(r[7].data||[]).forEach(function(x){if(x.ramp_start)D.repRamp[x.name]=x.ramp_start});D.repPass={};(r[7].data||[]).forEach(function(x){if(x.passcode)D.repPass[x.name]=x.passcode});D.calls=(r[8].data||[]);
  D.targets={};r[3].data.forEach(function(t){D.targets[t.key]=Number(t.value)});
  if(D.targets.owner_goal!=null)D.ownerGoal=D.targets.owner_goal;
  if(D.targets.owner_fallout!=null)D.ownerFallout=D.targets.owner_fallout;
  render();
}
function T(k,d){return D.targets[k]!=null?D.targets[k]:d}

var BOARD=null; // null = total acq, else rep name
function repOf(l){return l.rep||D.reps[0]}
function leadRepOk(l){return !BOARD||repOf(l)===BOARD}
function sumAct(from){
  var o={dials:0,convos:0,talk:0};
  D.act.forEach(function(a){if(a.on_date>=from&&(!BOARD||(a.rep||D.reps[0])===BOARD)){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  return o;
}
function leadById(id){return D.leads.find(function(l){return l.id===id})}
function countOffers(from){return D.offers.filter(function(o){var l=leadById(o.lead_id);return o.offered_on>=from&&(!l||leadRepOk(l))}).length}
function countContracts(from){return D.leads.filter(function(l){return l.contracted_on&&l.contracted_on>=from&&leadRepOk(l)}).length}
function countLeadsIn(from){return D.leads.filter(function(l){return (l.created_at||'').slice(0,10)>=from&&leadRepOk(l)}).length}
function closedStats(from){
  var o={assigned:0,closed:0,revenue:0};
  D.leads.forEach(function(l){
    if(!l.deal_id||!leadRepOk(l))return;
    var em=stageMoveOn(l.deal_id,'EMD In'),cl=stageMoveOn(l.deal_id,'Closed');
    if(em&&em>=from)o.assigned++;
    if(cl&&cl>=from){o.closed++;var d=linkedDeal(l);o.revenue+=(d&&d.revenue_closed)||0}
  });
  return o;
}

/* ============ RENDER ============ */
function render(){renderScript();renderToday();renderGoal();renderCommand();renderBot();renderEarnings();renderMetrics();renderInputs()}

function renderToday(){
  var t=today();
  var reps=D.reps;
  var n=Math.max(1,reps.length);
  var stats={};reps.forEach(function(rp){stats[rp]=repRange(rp,t)});
  function hm(min){return Math.floor(min/60)+'h '+(min%60)+'m'}
  var bigSize='min('+Math.max(11,Math.floor(64/n))+'vw,96px)';
  var smallSize='min('+Math.max(7,Math.floor(40/n))+'vw,54px)';

  var h='<div class="kpi" style="padding:24px 8px 18px;border-radius:20px;min-height:calc(100vh - 170px);display:flex;flex-direction:column">';

  // rep name header row
  h+='<div style="display:flex;margin-bottom:6px">'+reps.map(function(rp){
    return '<div style="flex:1;text-align:center;font-size:min('+Math.max(4,Math.floor(10/n*2))+'vw,18px);font-weight:800;letter-spacing:.08em;color:var(--gold)">'+esc(rp.split(' ')[0]).toUpperCase()+'</div>';
  }).join('')+'</div>';

  var rows=[
    ['\uD83D\uDCDE DIALS','dials',T('dials_day',320),null],
    ['\uD83D\uDCAC CONVOS','convos',T('convos_day',70),null],
    ['\u23F1 TALK TIME','talk',T('talkmin_day',420),hm],
    ['\uD83D\uDCB0 OFFERS','offers',T('offers_day',10),null],
    ['\uD83D\uDCDD CONTRACTS','contracts',T('contracts_day',1),null]
  ];
  rows.forEach(function(row,ri){
    var label=row[0], key=row[1], target=row[2], fmtFn=row[3];
    var vals=reps.map(function(rp){return stats[rp][key]});
    var best=Math.max.apply(null,vals);
    var teamV=vals.reduce(function(a,b){return a+b},0);
    var pct=target?Math.min(100,Math.round(teamV/target*100)):0;
    h+='<div style="'+(ri>0?'border-top:1px solid var(--line);':'')+'padding:10px 0;flex:1;display:flex;flex-direction:column;justify-content:center">'
     +'<div style="text-align:center;font-size:13px;letter-spacing:.14em;font-weight:800;color:var(--mut);margin-bottom:8px">'+label+'</div>'
     +'<div style="display:flex;align-items:baseline">'+reps.map(function(rp,i){
        var v=vals[i], lead=v===best&&v>0;
        var disp=fmtFn?fmtFn(v):v;
        return '<div style="flex:1;text-align:center"><span style="font-size:'+(fmtFn?smallSize:bigSize)+';font-weight:800;line-height:1;color:'+(lead?'var(--gold)':'var(--text)')+'">'+disp+'</span>'+(lead?' <span style="font-size:18px">\uD83D\uDC51</span>':'')+'</div>';
      }).join('')+'</div>'
     +'</div>';
  });
  // 6th row: projected revenue (month pace)
  (function(){
    var di=daysInfo(), avgFee=T('avgfee',15000);
    var m=monthStart();
    var projs=reps.map(function(rp){
      var ms=repRange(rp,m);
      return Math.round(((ms.contracts/di.elapsed)*di.total)*avgFee);
    });
    var best=Math.max.apply(null,projs);
    h+='<div style="border-top:1px solid var(--line);padding:10px 0;flex:1;display:flex;flex-direction:column;justify-content:center">'
     +'<div style="text-align:center;font-size:13px;letter-spacing:.14em;font-weight:800;color:var(--mut);margin-bottom:8px">\uD83D\uDCC8 PROJECTED REV LOCKED UP</div>'
     +'<div style="display:flex;align-items:baseline">'+reps.map(function(rp,i){
        var v=projs[i], lead=v===best&&v>0;
        return '<div style="flex:1;text-align:center"><span style="font-size:'+smallSize+';font-weight:800;line-height:1;color:'+(lead?'var(--gold)':'var(--text)')+'">'+fmt$(v)+'</span>'+(lead?' <span style="font-size:18px">\uD83D\uDC51</span>':'')+'</div>';
      }).join('')+'</div>'
     +'</div>';
  })();
  h+='</div>';
  document.getElementById('v_today').innerHTML=h;
}

function renderLeads(){
  var h='<input placeholder="🔍 Search name, address, phone…" oninput="leadSearch(this.value)" id="lsearch">'
   +'<button class="btn g big" onclick="openLeadForm()">➕ Add lead</button><div style="height:10px"></div><div id="leadList"></div>';
  document.getElementById('v_leads').innerHTML=h;
  leadSearch('');
}
function leadSearch(q){
  q=(q||'').toLowerCase();
  var byStage={};STAGES.forEach(function(s){byStage[s]=[]});
  D.leads.forEach(function(l){
    var hay=((l.name||'')+' '+(l.address||'')+' '+(l.phone||'')+' '+(l.market||'')).toLowerCase();
    if(!q||hay.indexOf(q)>=0) byStage[l.stage||'New'].push(l);
  });
  var h='';
  STAGES.forEach(function(s){
    var arr=byStage[s];if(!arr.length)return;
    h+='<div class="sm mut" style="margin:10px 0 6px;font-weight:700;letter-spacing:.05em">'+s.toUpperCase()+' ('+arr.length+')</div>';
    arr.forEach(function(l){h+=leadCard(l)});
  });
  document.getElementById('leadList').innerHTML=h||'<div class="sm mut">No leads match.</div>';
}
function leadCard(l){
  var offs=D.offers.filter(function(o){return o.lead_id===l.id});
  var t=today(), od=l.next_followup&&l.next_followup<t&&l.stage!=='Dead'&&l.stage!=='Under Contract';
  return '<div class="card" onclick="openLead(\''+l.id+'\')" style="cursor:pointer">'
   +'<div class="row"><b>'+esc(l.name||'—')+'</b><span class="pill '+PCLS[l.stage||'New']+'">'+(l.stage||'New')+'</span></div>'
   +'<div class="sm mut">'+esc(l.address||'')+(l.market?' · '+esc(l.market):'')+' · '+esc(l.source||'Meta')+' · 👤 '+esc(repOf(l))+'</div>'
   +'<div class="sm" style="margin-top:5px">Ask '+fmt$(l.asking)+' · Max '+fmt$(l.max_offer)+' · Offers: <b>'+offs.length+'</b>'+(l.contract_price?' · 📝 '+fmt$(l.contract_price):'')+'</div>'
   +(od?'<div class="warn" style="margin-top:4px">⏰ Follow-up overdue ('+l.next_followup+')</div>':(l.next_followup&&l.stage!=='Dead'?'<div class="sm mut" style="margin-top:4px">Next touch: '+l.next_followup+'</div>':''))
   +(l.stage==='Under Contract'&&!l.sent_to_dispo?'<div class="sm" style="margin-top:4px;color:var(--gold)">➡️ Ready to send to Dispo</div>':'')
   +(l.sent_to_dispo?'<div class="sm" style="margin-top:4px;color:var(--green)">✅ In Dispo pipeline</div>':'')
   +'</div>';
}

function logOfferQuick(){
  var h='<h2>\uD83D\uDCB0 Log an offer</h2>'
   +'<label>Rep</label><select id="qo_rep">'+payReps().concat(D.reps.indexOf(OWNER_REP)>=0?[OWNER_REP]:[]).map(function(rp){return '<option>'+esc(rp)+'</option>'}).join('')+'</select>'
   +'<label>Property / seller (optional)</label><input id="qo_addr" placeholder="e.g. 123 Main St or Smith">'
   +'<label>Offer amount ($)</label><input id="qo_amt" type="number">'
   +'<button class="btn g big" onclick="saveOfferQuick()">Save offer</button>'
   +'<button class="btn mut" onclick="closeModal()">Cancel</button>';
  openModal(h);
}
async function saveOfferQuick(){
  var rep=document.getElementById('qo_rep').value;
  var addr=document.getElementById('qo_addr').value||null;
  var amt=Number(document.getElementById('qo_amt').value)||null;
  var l=await db.from('acq_leads').insert({name:addr,address:addr,rep:rep,stage:'Offer Made',source:'GHL'}).select();
  if(l.error)return alert(l.error.message);
  var r=await db.from('acq_offers').insert({lead_id:l.data[0].id,amount:amt,offered_on:today()});
  if(r.error)return alert(r.error.message);
  closeModal();loadAll();
}
function logContractQuick(){
  var h='<h2>\uD83D\uDCDD Log a contract</h2>'
   +'<label>Rep</label><select id="qc_rep">'+payReps().concat(D.reps.indexOf(OWNER_REP)>=0?[OWNER_REP]:[]).map(function(rp){return '<option>'+esc(rp)+'</option>'}).join('')+'</select>'
   +'<label>Property address</label><input id="qc_addr" placeholder="required">'
   +'<label>Seller name</label><input id="qc_name">'
   +'<label>Contract price ($)</label><input id="qc_price" type="number">'
   +'<label>Contracted on</label><input id="qc_date" type="date" value="'+today()+'">'
   +'<label style="display:flex;align-items:center;gap:8px;margin-top:6px"><input id="qc_dispo" type="checkbox" checked style="width:auto"> Send to Dispo command center</label>'
   +'<button class="btn gr big" onclick="saveContractQuick()">Lock it \uD83C\uDF89</button>'
   +'<button class="btn mut" onclick="closeModal()">Cancel</button>';
  openModal(h);
}
async function saveContractQuick(){
  var rep=document.getElementById('qc_rep').value;
  var addr=(document.getElementById('qc_addr').value||'').trim();
  if(!addr)return alert('Address required \u2014 the dispo side needs it.');
  var nm=document.getElementById('qc_name').value||null;
  var price=Number(document.getElementById('qc_price').value)||null;
  var don=document.getElementById('qc_date').value||today();
  var toDispo=document.getElementById('qc_dispo').checked;
  var ins={name:nm,address:addr,rep:rep,stage:'Under Contract',source:'GHL',contract_price:price,contracted_on:don};
  var l=await db.from('acq_leads').insert(ins).select();
  if(l.error)return alert(l.error.message);
  if(toDispo){

var MET_FROM=null; // null = all time
function setMetRange(f){MET_FROM=f;renderMetrics()}
function linkedDeal(l){if(!l.deal_id)return null;return D.ddeals.find(function(d){return d.id===l.deal_id})||null}
function stageMoveOn(dealId,stage){
  var h=D.dhist.filter(function(x){return x.deal_id===dealId&&x.stage===stage}).sort(function(a,b){return a.entered_on<b.entered_on?-1:1});
  return h.length?h[0].entered_on:null;
}
function inR(dt){if(!dt)return false;var d=(dt+'').slice(0,10);return !MET_FROM||d>=MET_FROM}
function metChain(){
  var leads=D.leads.filter(function(l){return inR(l.created_at)});
  var bad=leads.filter(function(l){return l.stage==='Dead'&&l.dead_reason==='Bad lead'}).length;
  var a={dials:0,convos:0,talk:0};
  D.act.forEach(function(x){if(inR(x.on_date)){a.dials+=x.dials||0;a.convos+=x.convos||0;a.talk+=x.talk_min||0}});
  var offers=D.offers.filter(function(o){return inR(o.offered_on)}).length;
  var contracts=D.leads.filter(function(l){return l.contracted_on&&inR(l.contracted_on)}).length;
  var assigned=0,closed=0,revenue=0,fees=[];
  D.leads.forEach(function(l){
    if(!l.deal_id)return;
    var em=stageMoveOn(l.deal_id,'EMD In'), cl=stageMoveOn(l.deal_id,'Closed');
    if(em&&inR(em))assigned++;
    if(cl&&inR(cl)){closed++;var d=linkedDeal(l);var f=d&&(d.revenue_closed||0);if(f){revenue+=f;fees.push(f)}}
  });
  return {leads:leads.length,net:leads.length-bad,dials:a.dials,convos:a.convos,talk:a.talk,offers:offers,contracts:contracts,assigned:assigned,closed:closed,revenue:revenue,fees:fees};
}
function ratio(a,b,dec){if(!a)return '—';var v=b/a;return dec?Math.round(v*Math.pow(10,dec))/Math.pow(10,dec):Math.round(v*100)+'%'}
function avgDays(pairs){
  var ds=pairs.filter(function(p){return p[0]&&p[1]}).map(function(p){return Math.round((new Date(p[1])-new Date(p[0]))/86400000)});
  if(!ds.length)return null;
  return Math.round(ds.reduce(function(s,x){return s+x},0)/ds.length);
}

function repMonth(rep){
  var m=monthStart();
  var o={dials:0,convos:0,talk:0,offers:0,contracts:0,rev:0};
  D.act.forEach(function(a){if(a.on_date>=m&&(a.rep||D.reps[0])===rep){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  D.offers.forEach(function(of){var l=leadById(of.lead_id);if(of.offered_on>=m&&l&&repOf(l)===rep)o.offers++});
  D.leads.forEach(function(l){
    if(repOf(l)!==rep)return;
    if(l.contracted_on&&l.contracted_on>=m)o.contracts++;
    if(l.deal_id){var cl=stageMoveOn(l.deal_id,'Closed');if(cl&&cl>=m){var d=linkedDeal(l);o.rev+=(d&&d.revenue_closed)||0}}
  });
  return o;
}
function commissionOf(rev){return rev*tierPct(rev)*T('fx',1.38)} // CAD
function revForCommission(goal){

  return 400000;
}
function daysInfo(){
  var now=new Date();
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var day=now.getDate();
  return {elapsed:day,left:Math.max(1,dim-day+1),total:dim};
}
function rampMonthOf(rep){

  var a=new Date(rs+'T00:00:00'), b=new Date();
  var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+1;
  return Math.min(12,Math.max(1,m));
}

function repRange(rep,from){
  var o={dials:0,convos:0,talk:0,offers:0,contracts:0};
  D.act.forEach(function(a){if((!from||a.on_date>=from)&&(a.rep||D.reps[0])===rep){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  D.offers.forEach(function(of){var l=leadById(of.lead_id);if((!from||of.offered_on>=from)&&l&&repOf(l)===rep)o.offers++});
  D.leads.forEach(function(l){if(repOf(l)!==rep)return;if(l.contracted_on&&(!from||l.contracted_on>=from))o.contracts++});
  return o;
}

function renderGoal(){
  var el=document.getElementById('v_goal');if(!el)return;
  var PR=payReps();if(!PR.length)PR=D.reps;
  var viewer=ME||OWNER_REP;
  var isOwnerView=(ROLE==='owner');
  // owner sees their own goal hitter; reps see theirs. Owner can also flip to a rep to inspect.
  var who = isOwnerView ? OWNER_REP : (ME||PR[0]);
  if(isOwnerView){ who=OWNER_REP; }

  var di=daysInfo(), avgFee=T('avgfee',15000), fx=T('fx',1.38);
  var monthName=new Date().toLocaleDateString('en-US',{month:'long'}).toUpperCase();
  var h='';

  // owner-only: rep switcher to inspect anyone


  var ownerTarget = (who===OWNER_REP);
  var ms=repRange(who,monthStart());

  // ============ TARGET (locked revenue to reverse-engineer against) ============
  var lockedTarget, fundedGoal, fallout, headerLine, subLine;
  if(ownerTarget){
    fundedGoal = Number(D.ownerGoal!=null?D.ownerGoal:T('owner_goal',150000));
    fallout = Number(D.ownerFallout!=null?D.ownerFallout:T('owner_fallout',50));
    var keep = Math.max(1,(100-fallout))/100;
    lockedTarget = Math.round(fundedGoal/keep);
    headerLine = monthName+' \u00b7 YOUR TARGET';
    subLine = 'Fund '+fmt$(fundedGoal)+' after '+fallout+'% fallout \u2192 lock '+fmt$(lockedTarget);
  } else {
    var mo=rampMonthOf(who);
    lockedTarget = RAMP[mo-1];
    fundedGoal = lockedTarget;
    fallout = 0;
    headerLine = monthName+' \u00b7 RAMP MONTH '+mo+(mo<=3?' \u00b7 NO PENALTY':'');
    subLine = 'revenue locked + closed';
  }

  var closed=metMonthRev(who);
  var pct=lockedTarget?Math.min(100,Math.round(closed/lockedTarget*100)):100;
  var col=closed>=lockedTarget?'var(--green)':(pct>=60?'var(--gold)':'var(--red)');

  // ============ GOAL CARD ============
  h+='<div class="card" style="text-align:center;padding:24px 14px">'
   +'<div class="sm mut" style="letter-spacing:.16em;font-weight:800">'+headerLine+'</div>';

  if(ownerTarget && (isOwnerView)){
    // editable inputs for owner
    h+='<div style="display:flex;gap:8px;justify-content:center;align-items:flex-end;margin:14px 0 6px;flex-wrap:wrap">'
     +'<div><div class="sm mut">FUND (CLOSED $)</div><input id="og_fund" type="number" value="'+fundedGoal+'" style="width:150px;text-align:center;font-size:20px;font-weight:800" oninput="saveOwnerGoal()"></div>'
     +'<div><div class="sm mut">FALLOUT %</div><input id="og_fo" type="number" value="'+fallout+'" style="width:80px;text-align:center;font-size:20px;font-weight:800" oninput="saveOwnerGoal()"></div>'
     +'</div>';
  }

  h+='<div style="font-size:13px;color:var(--mut);margin-top:'+(ownerTarget?'6px':'14px')+'">MUST LOCK</div>'
   +'<div style="font-size:min(15vw,68px);font-weight:800;line-height:1.1;color:var(--gold)">'+fmt$(lockedTarget)+'</div>'
   +'<div style="font-size:12px;color:var(--mut)">'+subLine+'</div>'
   +'<div class="sbar" style="height:14px;margin:16px 8% 0;border-radius:99px"><i style="width:'+pct+'%;background:'+col+'"></i></div>'
   +'<div class="row" style="margin-top:10px;padding:0 6%"><span class="sm mut">LOCKED: <b style="color:'+col+'">'+fmt$(closed)+'</b></span><span class="sm mut">TO GO: <b>'+fmt$(Math.max(0,lockedTarget-closed))+'</b></span></div>'
   +'</div>';

  // ============ REVERSE ENGINEERED ============
  var reqContracts=lockedTarget>0?Math.max(1,Math.ceil(lockedTarget/avgFee)):0;
  var convoPerContract=ms.contracts>0?Math.max(5,Math.round(ms.convos/ms.contracts)):40;
  var dialPerConvo=ms.convos>0?Math.max(2,Math.round(ms.dials/ms.convos)):5;
  var contractsLeft=Math.max(0,reqContracts-ms.contracts);
  var convosNeeded=contractsLeft*convoPerContract;
  var dialsNeeded=convosNeeded*dialPerConvo;
  var dialsDay=di.left?Math.ceil(dialsNeeded/di.left):0;
  var curDialsDay=Math.round(ms.dials/di.elapsed);
  var covered=curDialsDay>=dialsDay;

  function bar(pct,col){return '<div class="sbar" style="height:10px;margin-top:8px;border-radius:99px"><i style="width:'+Math.min(100,Math.max(0,pct))+'%;background:'+col+'"></i></div>'}
  function prow(icon,label,have,need,hint,fmtFn){
    var f=fmtFn||function(x){return x};
    var pct=need>0?Math.round(have/need*100):100;
    var done=have>=need&&need>0;
    var col=done?'var(--green)':(pct>=60?'var(--gold)':'var(--gold)');
    return '<div style="padding:14px 0;border-bottom:1px solid var(--line)">'
      +'<div class="row"><div style="font-size:15px;font-weight:700">'+icon+' '+label+'</div>'
      +'<div style="font-size:17px;font-weight:800;text-align:right">'+f(have)+' <span class="sm mut">/ '+f(need)+(done?' \u2705':'')+'</span></div></div>'
      +(hint?'<div class="sm mut">'+hint+'</div>':'')
      +bar(pct,col)+'</div>';
  }

  if(lockedTarget>0){
    // extra ratios for the full ladder
    var offerPerContract=ms.contracts>0?Math.max(1,Math.round(ms.offers/ms.contracts)):3;
    var talkPerConvo=ms.convos>0?Math.max(1,ms.talk/ms.convos):4; // minutes
    var leadPerContract=(function(){
      var lc=0,cc=0,m=monthStart();
      D.leads.forEach(function(l){if(repOf(l)===who&&l.created_at&&l.created_at.slice(0,10)>=m){lc++;if(l.contracted_on&&l.contracted_on>=m)cc++;}});
      return cc>0?Math.max(1,Math.round(lc/cc)):(convoPerContract*2);
    })();
    var offersNeeded=contractsLeft*offerPerContract;
    var leadsNeeded=contractsLeft*leadPerContract;
    var talkNeeded=Math.round(convosNeeded*talkPerConvo); // minutes
    function hm(min){return Math.floor(min/60)+'h '+(min%60)+'m'}
    // leads count this month for rep
    var leadsHave=(function(){var c=0,m=monthStart();D.leads.forEach(function(l){if(repOf(l)===who&&l.created_at&&l.created_at.slice(0,10)>=m)c++});return c})();
    var offersHave=(function(){var c=0,m=monthStart();D.offers.forEach(function(of){var l=leadById(of.lead_id);if(of.offered_on>=m&&l&&repOf(l)===who)c++});return c})();
    function hmv(min){return Math.floor(min/60)+'h '+(min%60)+'m'}
    var contractsTotal=reqContracts, offersTotal=reqContracts*offerPerContract, convosTotal=reqContracts*convoPerContract, dialsTotal=reqContracts*convoPerContract*dialPerConvo, leadsTotal=reqContracts*leadPerContract, talkTotal=Math.round(convosTotal*talkPerConvo);
    h+='<div class="card"><h2>\uD83D\uDD27 The climb to '+fmt$(lockedTarget)+'</h2>'
     +'<div class="sm mut" style="margin:-4px 0 10px">Each bar fills as you close the gap this month.</div>'
     +prow('\uD83D\uDCE5','Leads',leadsHave,leadsTotal,leadPerContract+' per contract \u2014 your rate')
     +prow('\uD83D\uDCDE','Dials',ms.dials,dialsTotal,dialPerConvo+' per convo \u2014 your rate')
     +prow('\uD83D\uDCAC','Convos',ms.convos,convosTotal,convoPerContract+' per contract \u2014 your rate')
     +prow('\u23F1','Talk time',ms.talk,talkTotal,talkPerConvo.toFixed(1)+' min per convo \u2014 your rate',hmv)
     +prow('\uD83D\uDCB0','Offers',offersHave,offersTotal,offerPerContract+' per contract \u2014 your rate')
     +prow('\uD83D\uDCDD','Contracts',ms.contracts,contractsTotal,'at '+fmt$(avgFee)+' avg fee'+(ownerTarget?' \u00b7 covers '+fallout+'% fallout':''))
     +'<div style="text-align:center;padding:18px 0 6px">'
     +'<div class="sm mut" style="letter-spacing:.12em;font-weight:800">YOUR DAILY NUMBER</div>'
     +'<div style="font-size:min(15vw,68px);font-weight:800;color:'+(covered?'var(--green)':'var(--gold)')+'">'+dialsDay+'</div>'
     +'<div class="sm mut">dials/day for the next '+di.left+' days \u00b7 you\u2019re averaging '+curDialsDay+'</div>'
     +(covered?'<div class="sm" style="color:var(--green);margin-top:8px">\u2705 Current volume covers it \u2014 keep swinging.</div>':'<div class="sm" style="color:var(--red);margin-top:8px">\u26A0\uFE0F +'+(dialsDay-curDialsDay)+' more dials/day between you and the goal.</div>')
     +'</div></div>';
  }

  // ============ WHAT IT PAYS (reps only; owner economics live elsewhere) ============
  if(!ownerTarget && lockedTarget>0){
    var moX=rampMonthOf(who);
    var baseCAD=Math.round(lockedTarget*tierPct(lockedTarget)*fx);
    var hitCAD=Math.round((lockedTarget*tierPct(lockedTarget)+lockedTarget*0.02)*fx);
    var missCAD=moX<=3?baseCAD:Math.round((lockedTarget*tierPct(lockedTarget)-lockedTarget*0.02)*fx);
    h+='<div class="card"><h2>\uD83D\uDCB0 What hitting it pays (CAD)</h2><table>'
     +'<tr><td>Hit the goal (+2% of rev)</td><td style="text-align:right;color:var(--green)"><b>'+fmt$(hitCAD)+'</b></td></tr>'
     +'<tr><td>Base at goal</td><td style="text-align:right"><b>'+fmt$(baseCAD)+'</b></td></tr>'
     +'<tr><td>Miss ('+(moX<=3?'protected':'\u22122% of rev')+')</td><td style="text-align:right;color:'+(moX<=3?'var(--mut)':'var(--red)')+'"><b>'+fmt$(missCAD)+'</b></td></tr>'
     +'</table><div class="sm mut" style="margin-top:6px">Full ramp on the Comp Plan tab.</div></div>';
  }

function speedToLead(){
  var ds=[];
  D.leads.forEach(function(l){
    if(!l.phone||!l.created_at)return;
    var p=(l.phone||'').replace(/[^0-9]/g,'').slice(-10);if(p.length<7)return;
    var t0=new Date(l.created_at).getTime(),best=null;
    (D.calls||[]).forEach(function(c){
      if(String(c.phone||'').slice(-10)!==p)return;
      var ct=new Date(c.called_at).getTime();
      if(ct>=t0&&(best===null||ct<best))best=ct;
    });
    if(best!==null)ds.push((best-t0)/60000);
  });
  if(!ds.length)return null;
  return Math.round(ds.reduce(function(s,x){return s+x},0)/ds.length);
}

function metMonthRev(rep){
  var ms=monthStart(),rev=0;
  D.leads.forEach(function(l){if(!l.deal_id)return;if(rep&&repOf(l)!==rep)return;var cl=stageMoveOn(l.deal_id,'Closed');
    if(cl&&cl>=ms){var d=linkedDeal(l);rev+=(d&&d.revenue_closed)||0}});
  return rev;
}
function ccFillRev(){
  var rp=document.getElementById('cc_rep').value;
  document.getElementById('cc_rev').value=metMonthRev(rp)||'';
  calcComm();
}
var RAMP=[0,20000,40000,60000,80000,100000,110000,120000,130000,140000,150000,160000];
function rampMonthGuess(){return Math.min(12,Math.max(1,(new Date().getMonth()-6)+1))||1}
function tierPct(rev){
  if(rev<=50000)return .10;
  if(rev<=100000)return .12;
  if(rev<=150000)return .14;
  if(rev<=200000)return .16;
  return .17;
}
function calcComm(){
  var out=document.getElementById('ccOut');if(!out)return;
  var rev=Number(document.getElementById('cc_rev').value)||0;
  var mo=Number(document.getElementById('cc_mo').value)||1;
  var strikes=Number(document.getElementById('cc_str').value)||0;
  var strv=Number(document.getElementById('cc_strv').value)||0;
  var fx=Number(document.getElementById('cc_fx').value)||1.38;
  var pct=tierPct(rev), base=rev*pct;
  var target=RAMP[mo-1], hit=rev>=target;
  var adj=hit?rev*0.02:(mo<=3?0:-rev*0.02);
  var strikeDed=strikes*strv;
  var usd=Math.max(0,base+adj-strikeDed), cad=usd*fx;
  out.innerHTML='<div class="grid" style="grid-template-columns:1fr 1fr">'
   +'<div class="kpi"><div class="v">'+(pct*100)+'%</div><div class="l">TIER</div></div>'
   +'<div class="kpi"><div class="v">'+fmt$(Math.round(base))+'</div><div class="l">BASE COMM</div></div>'
   +'<div class="kpi"><div class="v" style="color:'+(hit?'var(--green)':'var(--red)')+'">'+(hit?'+':'')+fmt$(Math.round(adj))+'</div><div class="l">RAMP '+(hit?'HIT ✓':(mo<=3?'PROTECTED':'MISS'))+' (tgt '+fmt$(target)+')</div></div>'
   +'<div class="kpi"><div class="v" style="color:'+(strikeDed?'var(--red)':'var(--text)')+'">−'+fmt$(strikeDed)+'</div><div class="l">STRIKES</div></div>'
   +'</div>'
   +'<div class="kpi" style="margin-bottom:10px"><div class="v" style="color:var(--gold);font-size:26px">'+fmt$(Math.round(usd))+' USD · '+fmt$(Math.round(cad))+' CAD</div><div class="l">THE CHECK</div></div>';
}

var HELP_STOP={'where':1,'do':1,'does':1,'i':1,'my':1,'me':1,'we':1,'our':1,'how':1,'what':1,'is':1,'are':1,'the':1,'a':1,'an':1,'to':1,'of':1,'in':1,'on':1,'for':1,'and':1,'or':1,'it':1,'can':1,'find':1,'see':1,'get':1,'go':1,'up':1,'set':1,'with':1,'this':1,'when':1,'why':1};
function helpMatches(q){
  q=(q||'').toLowerCase().trim();var idx=[];
  if(!q){HELP_TOPICS.forEach(function(_,i){idx.push(i)});return idx}
  var raw=q.split(/[^a-z0-9$%]+/).filter(Boolean);
  var words=raw.filter(function(w){return !HELP_STOP[w]});if(!words.length)words=raw;
  var all=[],any=[];
  HELP_TOPICS.forEach(function(t,i){
    var hay=(t.q+' '+(t.k||'')+' '+t.a).toLowerCase().replace(/<[^>]*>/g,' ');
    var m=0;words.forEach(function(w){if(hay.indexOf(w)>=0)m++});
    if(m===words.length)all.push(i);else if(m>0)any.push(i);
  });
  return all.length?all:any;
}
function helpFilter(q){
  var hits=helpMatches(q),qq=(q||'').trim();
  HELP_TOPICS.forEach(function(t,i){
    var row=document.getElementById('hlprow'+i),body=document.getElementById('hlp'+i);
    if(!row)return;var hit=hits.indexOf(i)>=0;
    row.style.display=hit?'block':'none';
    if(body)body.style.display=(qq&&hit&&hits.length<=4)?'block':'none';
  });
  var none=document.getElementById('hlpnone');
  if(none)none.style.display=hits.length?'none':'block';
}

  HELP_TOPICS.forEach(function(t,i){
    h+='<div id="hlprow'+i+'" style="border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden">'
     +'<div onclick="var b=document.getElementById(\'hlp'+i+'\');b.style.display=b.style.display===\'none\'?\'block\':\'none\'" style="padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600">'+t.q+'</div>'
     +'<div id="hlp'+i+'" style="display:none;padding:0 12px 12px;font-size:12px;line-height:1.6">'+t.a+'</div></div>';
  });
  h+='<div id="hlpnone" style="display:none;font-size:12px;color:var(--mut);padding:8px 2px">No match — try one word (lead, offer, contract, dispo, install…).</div>'
   +'<button class="btn mut" onclick="closeModal()">Close</button>';
  openModal(h);
}
function pickIdentity(){
  var h='<h2>\ud83d\udc4b Who are you?</h2><div class="sm mut" style="margin-bottom:10px">Personalizes your Earnings and money math. Remembered on this device.</div>'
   +payReps().map(function(rp){return '<button class="btn g big" onclick="setIdentity(\''+esc(rp)+'\')">'+esc(rp)+'</button>'}).join('');
  openModal(h);
}
function setIdentity(rp){
  ME=rp;localStorage.setItem('cp_acq_me',rp);
  closeModal();render();
}
function openModal(h){document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

if(ROLE){document.getElementById('lock').style.display='none';buildTabs();loadAll();}
</script>
</body>
</html>
