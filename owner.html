.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;overflow-y:auto;padding:20px 12px 60px}
.modal.on{display:block}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;margin:0 auto;padding:18px 16px}

#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.mut{color:var(--mut)}.sm{font-size:11px}.warn{color:var(--red);font-size:11px;font-weight:700}

<script>
var db=supabase.createClient('https://voitbqpvynbvlibuzxbz.supabase.co','sb_publishable_QreaC86dKq8FRmJPDkeenA_wZO8G5YG');
var D={};
var OWN_VIEW=localStorage.getItem('cp_own_view')||'nic';
var NICTAB=localStorage.getItem('cp_nic_tab')||'funnel';if(NICTAB==='home')NICTAB='funnel';
function setNicTab(t){NICTAB=t;localStorage.setItem('cp_nic_tab',t);render()}
// Nic's personal plan (August sheet): daily 160 dials / 43 convos / 262m talk / 6 offers ; month 20 contracts / $400K
var NETGOAL=Number(localStorage.getItem('cp_net_goal'))||50000;
function saveNetGoal(){var v=Number(document.getElementById('ng_in').value)||0;if(v>0){NETGOAL=v;localStorage.setItem('cp_net_goal',v);render()}}
var NICPLAN={dials:160,convos:43,talk:262,offers:6,contractsMo:20,projMo:400000};

var DISPOGOAL={dials:2300,convos:690,shared:1311,offersRec:46,walks:69,assigned:12,closed:7,rev:140000,buyers:130};
var CHECK={
 daily:['5:30\u20136 \u00b7 Read 20 pages','6\u20137 \u00b7 Lift','7\u20138 \u00b7 Automation block','8\u20139 \u00b7 Toledo','9\u201310 \u00b7 Meta','10\u20137 \u00b7 All leads','6\u20137p \u00b7 Meta / hot CC','7\u20138:30 \u00b7 Hot / callbacks','8:30\u20139:30 \u00b7 Walk + AI / sub-to'],
 weekly:['Meta performer review','KPI meeting','Automation audit','Audit all contracts','Meta best performer'],
 monthly:['Business audit','Plan next month','Pay CC','Audit all contracts (month)']
};
function weekKeyOwn(d){var x=new Date(d+'T12:00:00');var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10)}
// ---- Founder Checklist v3: dispo-style time blocks + notes + SOP sections ----
var CK={date:today(),tpl:null,done:{},notes:{},oneoff:[],prev:{},loaded:''};
async function kvGet(k){try{var r=await db.from('owner_kv').select('value').eq('key',k).maybeSingle();return r.data?JSON.parse(r.data.value):null}catch(e){return null}}
async function kvSet(k,v){await db.from('owner_kv').upsert([{key:k,value:JSON.stringify(v)}],{onConflict:'key'})}
var MK={loaded:'',cspend:{}};
async function loadMK(m){MK.cspend=(await kvGet('mkt_cspend_'+m))||{};MK.loaded=m;render();}
async function mkSaveSpend(){
  var o={};document.querySelectorAll('.mkspin').forEach(function(el){var v=Number(el.value)||0;if(v>0)o[el.getAttribute('data-c')]=v;});
  MK.cspend=o;

  if(sum>0){await db.from('master_monthly').upsert([{month:MK.loaded,source:'meta',spend:sum}],{onConflict:'month,source'});loadAll();}
  else render();
}
function ckDoneKey(scope){return scope==='daily'?'ck3d_'+CK.date:scope==='weekly'?'ck3w_'+weekKeyOwn(CK.date):'ck3m_'+CK.date.slice(0,7)}
function ckParse(s){var m=String(s).match(/^(.{1,14}?)\s*\u00b7\s*(.+)$/);return m?{time:m[1],t:m[2]}:{time:'',t:String(s)}}
async function loadCK(){
  var stamp=CK.date;
  var r=await Promise.all([kvGet('ck_tpl3'),kvGet('ck3d_'+stamp),kvGet('ck3w_'+weekKeyOwn(stamp)),kvGet('ck3m_'+stamp.slice(0,7)),kvGet('ck3n_'+stamp),kvGet('ck3o_'+stamp),kvGet('ck_tpl')]);
  if(!r[0]){
    var old=r[6]||CHECK;
    var mk=function(a,pf){return (a||[]).map(function(s,i){var p=ckParse(typeof s==='string'?s:s.t);return {id:pf+i+'_'+Math.random().toString(36).slice(2,6),t:p.t,time:p.time,how:''}})};
    CK.tpl={daily:mk(old.daily,'d'),weekly:mk(old.weekly,'w'),monthly:mk(old.monthly,'m')};
    kvSet('ck_tpl3',CK.tpl);
  } else CK.tpl=r[0];
  CK.done={daily:r[1]||[],weekly:r[2]||[],monthly:r[3]||[]};
  CK.notes=r[4]||{};
  CK.oneoff=r[5]||[];
  CK.prev={};
  try{
    var pv=await db.from('owner_kv').select('key,value').like('key','ck3n_%');
    if(pv.data){
      pv.data.map(function(x){return {d:x.key.slice(5),v:JSON.parse(x.value)}})
        .filter(function(x){return x.d<stamp})
        .sort(function(a,b){return a.d<b.d?1:-1})
        .forEach(function(x){for(var k in x.v){if(x.v[k]&&String(x.v[k]).trim()&&!CK.prev[k])CK.prev[k]={note:x.v[k],on:x.d}}});
    }
  }catch(e){}
  CK.streak=0;
  try{
    var sd=await db.from('owner_kv').select('key,value').like('key','ck3d_%');
    var map={};(sd.data||[]).forEach(function(x){map[x.key.slice(5)]=JSON.parse(x.value)||[]});
    var t=today();
    function full(d){
      var req=CK.tpl.daily.filter(function(it){return ckShowsOn(it,d)}).map(function(it){return it.id});
      if(!req.length)return true;
      var dv=map[d]||[];
      return req.every(function(id){return dv.indexOf(id)>=0});
    }
    var cur=new Date(t+'T12:00:00');
    if(!full(t))cur.setDate(cur.getDate()-1);
    while(true){
      var ds=cur.toISOString().slice(0,10);
      if(!map[ds]||!full(ds))break;
      CK.streak++;cur.setDate(cur.getDate()-1);
      if(CK.streak>3650)break;
    }
    CK.istreak={};
    CK.tpl.daily.forEach(function(it){
      var n=0,c=new Date(t+'T12:00:00');
      if(ckShowsOn(it,t)&&(map[t]||[]).indexOf(it.id)<0)c.setDate(c.getDate()-1);
      for(var g=0;g<3650;g++){
        var ds2=c.toISOString().slice(0,10);
        if(ckShowsOn(it,ds2)){
          if((map[ds2]||[]).indexOf(it.id)>=0)n++;else break;
        }
        c.setDate(c.getDate()-1);
      }
      CK.istreak[it.id]=n;
    });
    // ---- lifetime stats ----
    var dts=Object.keys(map).sort();
    CK.stats=null;
    if(dts.length){
      var first=dts[0],days=[],c2=new Date(first+'T12:00:00'),te=new Date(t+'T12:00:00');
      while(c2<=te){days.push(c2.toISOString().slice(0,10));c2.setDate(c2.getDate()+1);}
      var perfect=0,best=0,run=0;
      days.forEach(function(d){
        if(full(d)&&(map[d]||[]).length){perfect++;run++;if(run>best)best=run;}
        else if(d!==t)run=0;
      });
      var per=CK.tpl.daily.map(function(it){
        var sch=0,hit=0,ib=0,ir=0;
        days.forEach(function(d){
          if(!ckShowsOn(it,d))return;
          sch++;
          if((map[d]||[]).indexOf(it.id)>=0){hit++;ir++;if(ir>ib)ib=ir;}
          else if(d!==t)ir=0;
        });
        return {t:it.t,pct:sch?Math.round(hit*100/sch):0,best:ib,cur:CK.istreak[it.id]||0};
      });
      CK.stats={best:best,perfect:perfect,total:days.length,per:per};
      CK.dayPct={};
      days.forEach(function(d){
        var req=CK.tpl.daily.filter(function(it){return ckShowsOn(it,d)}).map(function(it){return it.id});
        if(!req.length)return;
        var dv=map[d]||[];
        var hit=req.filter(function(id){return dv.indexOf(id)>=0}).length;
        CK.dayPct[d]=Math.round(hit*100/req.length);
      });
    }
  }catch(e){}
  CK.loaded=stamp;
  CK.wasToday=(stamp===today());
  render();
}
function ckShowsOn(it,d){
  var dt=new Date(d+'T12:00:00');
  if(it.dow&&it.dow.length&&it.dow.indexOf(dt.getDay())<0)return false;
  if(it.dom&&it.dom.length)return it.dom.indexOf(dt.getDate())>=0;
  if(!it.every||it.every<2)return true;
  var a=new Date((it.anchor||'2026-08-04')+'T12:00:00');
  return Math.round((dt-a)/86400000)%it.every===0;
}
var CKT={id:null,endAt:0,iv:null,day:''};
(function(){try{var s=JSON.parse(localStorage.getItem('cp_ckt')||'null');if(s&&s.endAt>Date.now()){CKT.id=s.id;CKT.endAt=s.endAt;CKT.day=s.day||today();CKT.iv=setInterval(ckTimerTick,1000);}else if(s){localStorage.removeItem('cp_ckt');}}catch(e){}})();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&CKT.id){clearInterval(CKT.iv);CKT.iv=setInterval(ckTimerTick,1000);ckTimerTick();}});
setInterval(function(){
  if(typeof NICTAB!=='undefined'&&NICTAB==='check'&&CK.loaded){
    if(CK.date<today()&&CK.loaded===CK.date&&CK.date===CK.loaded){}
    if(document.visibilityState!=='hidden'&&!CKT.id)render();
  }
},60000);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&CK.wasToday&&CK.loaded&&CK.loaded<today()){ckSetDate(today());}
});

function ckMinsG(tm){
  if(!tm)return null;
  var m=String(tm).toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?/);
  if(!m)return null;
  var hh=parseInt(m[1],10),mm=m[2]?parseInt(m[2],10):0,mer=m[3];
  if(!mer){var e=String(tm).toLowerCase().match(/(am|pm|a|p)\s*$/);mer=e?e[1]:null;}
  if(mer&&mer.charAt(0)==='p'&&hh<12)hh+=12;
  if(mer&&mer.charAt(0)==='a'&&hh===12)hh=0;
  return hh*60+mm;
}
function ckDur(tm){
  if(!tm||String(tm).indexOf('\u2013')<0&&String(tm).indexOf('-')<0)return null;
  var parts=String(tm).split(/[\u2013-]/);
  var s=ckMinsG(tm),e=ckMinsG(parts[1]);
  if(s===null||e===null)return null;
  if(e<=s)e+=720;
  var d=e-s;
  return d>0&&d<=780?d:null;
}
function ckDurLbl(m){return m>=60?(Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'')):m+'m';}
function ckBeep(){
  try{
    var ac=new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.25;
    o.start();setTimeout(function(){o.frequency.value=1100},180);setTimeout(function(){o.stop();ac.close()},700);
  }catch(e){}
}
function ckTimerTick(){
  var el=document.getElementById('tmr_'+CKT.id);
  var left=Math.round((CKT.endAt-Date.now())/1000);
  if(left<=0){
    if(el){el.textContent='\u23f0 TIME!';el.style.color='var(--red)';}
    ckBeep();clearInterval(CKT.iv);CKT.id=null;try{localStorage.removeItem('cp_ckt')}catch(e){}
    return;
  }
  if(el){var hh2=Math.floor(left/3600),mm2=Math.floor(left%3600/60),ss2=left%60;el.textContent=(hh2?hh2+':'+('0'+mm2).slice(-2):mm2)+':'+('0'+ss2).slice(-2);}
}
function ckTimer(id,mins){
  if(CKT.id===id&&CKT.day===CK.date){clearInterval(CKT.iv);CKT.id=null;try{localStorage.removeItem('cp_ckt')}catch(e){}render();return;}
  if(CKT.iv)clearInterval(CKT.iv);
  CKT.id=id;CKT.endAt=Date.now()+mins*60000;CKT.day=CK.date;
  try{localStorage.setItem('cp_ckt',JSON.stringify({id:CKT.id,endAt:CKT.endAt,day:CKT.day}))}catch(e){}
  render();
  CKT.iv=setInterval(ckTimerTick,1000);
}
function ckLastDay(){var x=new Date(CK.date+'T12:00:00');x.setDate(x.getDate()+1);return x.getDate()===1;}
function ckDateLbl(d){
  var x=new Date(d+'T12:00:00');
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],mos=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[x.getDay()]+' \u00b7 '+mos[x.getMonth()]+' '+x.getDate();
}
function ckSetDate(d){if(!d)return;CK.date=d;CK.loaded='';loadCK();}
function ckShift(n){var x=new Date(CK.date+'T12:00:00');x.setDate(x.getDate()+n);ckSetDate(x.toISOString().slice(0,10));}
async function ckToggle(scope,id){

  CK.done[scope]=a;render();
  await kvSet(ckDoneKey(scope),a);
}
async function ckNote(id,val){CK.notes[id]=val;await kvSet('ck3n_'+CK.date,CK.notes);}

  var f=ckItem(id);if(!f)return;

  if(!txt||txt===f.it.t)return;
  f.it.t=txt;
  await kvSet(f.src==='one'?'ck3o_'+CK.date:'ck_tpl3',f.src==='one'?CK.oneoff:CK.tpl);
}

  var f=null;
  ['daily','weekly','monthly'].forEach(function(s){CK.tpl[s].forEach(function(it){if(it.id===id)f={it:it,src:'tpl'}})});
  CK.oneoff.forEach(function(it){if(it.id===id)f={it:it,src:'one'}});
  return f;
}

var STD={dialsPerConvo:6.1,convosPerOffer:3.0,offersPerContract:11.8,leadsPerContract:18.6,talkPerConvo:8.9,closeRate:0.47,avgFee:15000};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function fmt$(n){return n==null||isNaN(n)?'\u2014':'$'+Number(n).toLocaleString()}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthStart(){return today().slice(0,8)+'01'}
function stlFmt(m){return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'}
function tryLogin(){
  var v=(document.getElementById('pass').value||'').trim();
  if(v==='clearpathowner'){localStorage.setItem('cp_owner_ok','1');unlock();}
  else document.getElementById('lockErr').textContent='Wrong passcode';
}
function unlock(){document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';loadAll();}
function logOut(){localStorage.removeItem('cp_owner_ok');location.reload();}
if(localStorage.getItem('cp_owner_ok')==='1')unlock();
async function loadAll(){
  var r=await Promise.all([
    db.from('acq_leads').select('*'),
    db.from('acq_activity').select('*'),
    db.from('acq_offers').select('*'),
    db.from('acq_reps').select('*').order('created_at'),
    db.from('acq_targets').select('*'),
    db.from('master_monthly').select('*').order('month'),
    db.from('master_expenses').select('*')
  ]);
  for(var i=0;i<r.length;i++){if(r[i].error){alert(r[i].error.message);return}}
  D.leads=r[0].data||[];D.act=r[1].data||[];D.offers=r[2].data||[];
  D.reps=(r[3].data||[]).map(function(x){return x.name});
  D.targets={};(r[4].data||[]).forEach(function(x){D.targets[x.key]=Number(x.value)});
  D.master=r[5].data||[];D.mexp=r[6].data||[];
  render();
}
function T(k,dflt){return D.targets&&D.targets[k]!=null?D.targets[k]:dflt}
function repOf(l){return l.claimed_by||l.rep||''}
function setOwnView(v){OWN_VIEW=v;localStorage.setItem('cp_own_view',v);render()}
function ownAgg(from){
  var o={leads:0,dials:0,convos:0,talk:0,offers:0,contracts:0,assigned:0,closed:0,rev:0,pipeDeals:0,pipeRev:0,cycleDays:[],falls:0};
  (D.leads||[]).forEach(function(l){
    var c=(l.created_at||'').slice(0,10);
    if(c>=from)o.leads++;
    if(l.contracted_on&&l.contracted_on>=from)o.contracts++;
    if(l.assigned_on&&l.assigned_on>=from)o.assigned++;
    if(l.stage==='Fallout')o.falls++;
    if(l.closed_on&&l.closed_on>=from){o.closed++;o.rev+=Number(l.revenue_closed)||0;
      if(c)o.cycleDays.push(Math.round((new Date(l.closed_on)-new Date(c))/86400000));}
    if(l.contracted_on&&!l.closed_on&&l.stage!=='Fallout'){o.pipeDeals++;o.pipeRev+=Number(l.projected_profit)||0}
  });
  (D.act||[]).forEach(function(a){if(a.on_date>=from){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  (D.offers||[]).forEach(function(x){if(x.offered_on&&String(x.offered_on).slice(0,10)>=from)o.offers++});
  o.talk=Math.round(o.talk/60);
  return o;
}
function repMonth(rp,from){
  var o={dials:0,convos:0,talk:0,offers:0,contracts:0,closed:0};
  (D.act||[]).forEach(function(a){if((a.rep||D.reps[0])===rp&&a.on_date>=from){o.dials+=a.dials||0;o.convos+=a.convos||0;o.talk+=a.talk_min||0}});
  (D.offers||[]).forEach(function(x){var r=x.rep||'';if(r===rp&&x.offered_on&&String(x.offered_on).slice(0,10)>=from)o.offers++});
  (D.leads||[]).forEach(function(l){if(repOf(l)!==rp)return;if(l.contracted_on&&l.contracted_on>=from)o.contracts++;if(l.closed_on&&l.closed_on>=from)o.closed++});
  o.talk=Math.round(o.talk/60);
  return o;
}
function tile(lbl,val,sub,col){return '<div class="tile"'+(col?' style="border-color:'+col+'"':'')+'><div class="sm mut">'+lbl+'</div><div style="font-size:24px;font-weight:800;'+(col?'color:'+col:'')+'">'+val+'</div>'+(sub?'<div class="sm mut" style="margin-top:2px">'+sub+'</div>':'')+'</div>'}

        +'<div class="sm" style="margin-top:4px">At standard: '+why+' \u2248 <b>'+fmt$(Math.round(extra$))+'</b> more expected revenue this month. Fix THIS first.</div>';
    }
    h+='<div class="card"><h2>2\ufe0f\u20e3 The constraint \u2014 '+curM+'</h2>'+conH+'</div>';

    var cyc=L.cycleDays.length?Math.round(L.cycleDays.reduce(function(a,b){return a+b},0)/L.cycleDays.length):null;
    h+='<div class="card"><h2>3\ufe0f\u20e3 Cash velocity</h2><div class="tiles">'
     +tile('Stuck in pipe',fmt$(L.pipeRev),L.pipeDeals+' deals contracted, not closed')
     +tile('Collected \u2014 '+curM,fmt$(L.rev),'')
     +tile('Lead \u2192 close',cyc!=null?cyc+' days':'\u2014','avg this month')
     +'</div><div class="sm mut" style="margin-top:8px">Faster cash funds next month\u2019s budget. Chase the oldest pipe deals first.</div></div>';

    var dayN=Math.max(1,new Date().getDate());
    var lpd=L.leads/dayN, reps=(D.reps||[]).length||1, perRep=lpd/reps;
    var capCol=perRep>12?'var(--red)':(perRep>9?'var(--gold)':'var(--green)');
    h+='<div class="card"><h2>4\ufe0f\u20e3 Capacity</h2><div class="tiles">'
     +tile('Leads / day',Math.round(lpd*10)/10,'month pace')
     +tile('Per rep / day',Math.round(perRep*10)/10,reps+' reps',capCol)
     +'</div><div class="sm mut" style="margin-top:8px">Past ~12 fresh leads/rep/day, follow-up collapses \u2014 hire trigger.</div></div>';

    var reinvest=L.rev?Math.round(spend/L.rev*100):null;
    h+='<div class="card"><h2>5\ufe0f\u20e3 Net + reinvestment</h2><div class="tiles">'
     +tile('NET \u2014 '+curM,fmt$(net),'after everything',net>=0?'var(--green)':'var(--red)')
     +tile('Reinvest rate',reinvest!=null?reinvest+'%':'\u2014','spend \u00f7 revenue')
     +'</div><div class="sm mut" style="margin-top:8px">Growth mode: ratio \u22653:1 \u2192 push reinvest hard.</div></div>';
  }
  el.innerHTML=h;
}
</script>
</body>
</html>
