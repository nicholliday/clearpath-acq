<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear Path tools</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:18px/1.5 Inter,system-ui,sans-serif;background:#0f172a;color:#e5e7eb}
  main{text-align:center;padding:24px;max-width:720px}
  h1{font-size:28px;margin:0 0 8px}
  p{margin:8px 0 24px;color:#9ca3af}
  a.bm{display:inline-block;padding:26px 56px;border-radius:16px;background:#2563eb;color:#fff;font:800 32px/1 Inter,system-ui,sans-serif;letter-spacing:.06em;text-decoration:none;box-shadow:0 10px 30px rgba(37,99,235,.45);cursor:grab}
  a.bm:active{cursor:grabbing}
  .arrow{font-size:60px;line-height:1;margin:0 0 10px}
  small{display:block;margin-top:28px;color:#6b7280;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="arrow">⬆</div>
  <h1>Drag this button up onto your bookmarks bar</h1>
  <p>Hold the mouse on it, drag it up to the row with “Spark Follow Up”, “Privy”…, let go.</p>
  <a class="bm" href="javascript:(function(){if(location.host.indexOf('magnyfi.com')<0&&location.host.indexOf('gohighlevel.com')<0){return;}if(document.getElementById('cp-deal-loaded')){var b=document.getElementById('cp-dark-btn');if(b){b.click();}return;}var s=document.createElement('script');s.src='https://nicholliday.github.io/clearpath-acq/deal-panel.js?t='+Date.now();document.head.appendChild(s);})();" onclick="return false;">CLEAR PATH</a>
  <small>Then, on any GHL page, click that bookmark once. DEAL tab appears on the right, moon in the corner. Clicking it again flips dark/light.</small>
</main>
</body>
</html>
